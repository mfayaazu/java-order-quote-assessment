apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-quote-service
  labels:
    app: order-quote-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-quote-service
  template:
    metadata:
      labels:
        app: order-quote-service
    spec:
      containers:
        - name: order-quote-service
          image: order-quote-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
